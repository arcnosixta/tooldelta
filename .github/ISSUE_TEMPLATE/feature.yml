name: Feature or rule request
description: Propose a concrete MCP contract-review improvement
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What review problem does this solve?
      description: Describe a real caller or consumer affected by a tool update.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Sanitized example and expected finding
      description: For schema rules, explain both input and output directions.
    validations:
      required: true
