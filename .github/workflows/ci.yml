name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI regression tests
        run: python -m unittest discover -v
      - name: Install package
        run: python -m pip install .
      - name: Installed package smoke check
        run: python -I -m tooldelta demo --format json --fail-on none
      - name: Installed HTML assets smoke check
        run: python -I -m tooldelta demo --format html -o reports/demo.html --fail-on none

  distribution-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install development tools
        run: python -m pip install build playwright
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/tooldelta-0.1.0-py3-none-any.whl
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Check report behavior in Chromium
        run: python scripts/check_report.py --screenshot reports/report.png
      - name: Generate Markdown artifact
        run: python -I -m tooldelta demo --format markdown -o reports/demo.md --fail-on none
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: distribution-and-report
          path: |
            dist/*
            reports/*
