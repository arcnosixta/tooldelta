[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tooldelta"
version = "0.2.1"
description = "Offline MCP tool contract diffs with actionable compatibility reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ToolDelta contributors"}]
keywords = ["mcp", "json-schema", "agents", "diff", "ci", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://arcnosixta.github.io/tooldelta/"
Repository = "https://github.com/arcnosixta/tooldelta"
Issues = "https://github.com/arcnosixta/tooldelta/issues"

[project.scripts]
mcp-tooldelta = "mcp_tooldelta.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_tooldelta*"]

[tool.setuptools.package-data]
mcp_tooldelta = ["templates/*.html", "examples/*.json"]
